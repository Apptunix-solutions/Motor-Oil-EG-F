name: Container

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and health-check image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --file docker/Dockerfile --tag zaytstore:test .

      - name: Start container
        run: docker run --detach --name zaytstore-test --publish 18080:8080 zaytstore:test

      - name: Check health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs zaytstore-test
          exit 1

      - name: Check SPA fallback
        run: curl --fail --silent http://127.0.0.1:18080/catalog >/dev/null

      - name: Stop container
        if: always()
        run: docker stop zaytstore-test || true
