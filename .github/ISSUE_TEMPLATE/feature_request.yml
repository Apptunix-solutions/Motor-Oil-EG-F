name: Feature request
description: Suggest an improvement to the ZaytStore marketplace.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What user need would this address?
      description: Explain the problem or opportunity, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how the experience could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you have considered.
