<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ZaytStore logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15542F"/>
      <stop offset="100%" stop-color="#0F3D20"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFD659"/>
      <stop offset="50%" stop-color="#E8A020"/>
      <stop offset="100%" stop-color="#B87500"/>
    </linearGradient>
    <radialGradient id="sheen" cx="38%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Oil drop body -->
  <path d="M256 80 C256 80,136 260,136 340 C136 404.8,189.2 456,256 456 C322.8 456,376 404.8,376 340 C376 260,256 80,256 80 Z"
        fill="url(#dropGrad)"/>

  <!-- Inner dark reflection shadow -->
  <path d="M256 80 C256 80,196 235,196 320 C196 358,224 386,256 390 C288 386,316 358,316 320 C316 235,256 80,256 80 Z"
        fill="#0F3D20" opacity="0.14"/>

  <!-- Glossy surface sheen -->
  <path d="M256 80 C256 80,136 260,136 340 C136 404.8,189.2 456,256 456 C322.8 456,376 404.8,376 340 C376 260,256 80,256 80 Z"
        fill="url(#sheen)"/>

  <!-- White highlight curve - gives a 3D look -->
  <path d="M180 330 C174 295,196 250,232 218"
        stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.45"/>

</svg>
